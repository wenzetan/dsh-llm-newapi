name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (host + client)
        run: npm run typecheck
      - name: Build (lib/index.js + lib/client.js)
        run: npm run build
      - name: Committed artifacts are current
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the rebuilt artifacts (github: installs build from the committed lib/)"
            exit 1
          }
      - name: Tests (client component suite + cordis composition smoke)
        run: npm test
      - name: Pack distribution tarball
        run: npm pack
      - name: Packed tarball is self-contained
        run: |
          # The profile install runs with autoInstallPeers: false; at runtime
          # the dsh host supplies the @deepseek-ai/* seam packages (and react
          # on the browser side). Everything ELSE the packed host bundle
          # imports must resolve from the tarball's own dependency list —
          # resolving through this repository's node_modules is what let a
          # missing dependency ship (v0.5.0's undici).
          mkdir /tmp/selfcheck && tar -xzf dsh-llm-newapi-*.tgz -C /tmp/selfcheck
          cd /tmp/selfcheck/package
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const source = readFileSync('lib/index.js', 'utf8')
            const specifiers = [...source.matchAll(/from\s+[\"']([^\"']+)[\"']/g)]
              .map(m => m[1]).filter(s => !s.startsWith('.') && !s.startsWith('node:'))
            const hostProvided = s => s === 'react' || s.startsWith('@deepseek-ai/')
            const own = [...new Set(specifiers)].filter(s => !hostProvided(s))
            const missing = own.filter(s => {
              try { import.meta.resolve(s, new URL('./lib/index.js', import.meta.url)); return false }
              catch { return true }
            })
            if (missing.length > 0) {
              console.error('imports not resolvable from the packed tarball (add to dependencies): ' + missing.join(', '))
              process.exit(1)
            }
            console.log('self-contained: ' + own.join(', '))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dsh-llm-newapi-*.tgz
          if-no-files-found: error

  # Compliance gate: run the dsh-plugin-check diagnostics (manifest
  # protocol / patch format / build pitfalls) over this repository and
  # require a pass verdict. The checker is cloned and built from its own
  # repo; its exported checkRepo() is a read-only static scan, so this job
  # only needs a checkout and the committed lib/ layout.
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Clone and build dsh-plugin-check
        run: |
          git clone --depth 1 https://github.com/omdsh-dev/dsh-plugin-check /tmp/pc
          cd /tmp/pc
          npm install --no-audit --no-fund
          npm run build
          # Runtime peers of the built entry (defineTool comes from
          # dsh-tools). legacy-peer-deps: the checker only needs these to
          # load; their own transitive peer pins conflict across rc versions.
          npm install --no-audit --no-fund --no-save --legacy-peer-deps \
            @deepseek-ai/dsh-tools@0.0.1-rc.1 \
            @deepseek-ai/cordis@4.0.1 \
            @deepseek-ai/dsh-invariants@0.0.1-rc.5
      - name: plugin_check verdict is pass
        run: |
          node --input-type=module -e "
            const m = await import('/tmp/pc/lib/index.js')
            const report = await m.checkRepo(process.cwd(), false)
            console.log(JSON.stringify(report, null, 2))
            if (report.verdict !== 'pass') {
              console.error('::error::dsh-plugin-check verdict: ' + report.verdict)
              process.exit(1)
            }
          "

  # Real-boot gate: install the packed tarball through the dsh CLI into a
  # fresh DSH_HOME and require `dsh web` to boot serving the plugin. This is
  # the check that would have caught both shipped breakages: v0.5.0 (a peer
  # the host does not provide made the whole plugin tree fail to load) and
  # v0.5.2 (the RPC channel silently never registered, so the browser met
  # the SPA fallback's 405).
  boot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh and pnpm
        run: npm install -g @deepseek-ai/dsh pnpm
      - name: Install the packed tarball into a fresh web profile
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME"
          TARBALL="$(pwd)/$(ls dsh-llm-newapi-*.tgz)"
          dsh plugin --profile web add "$TARBALL"
          PROFILE="$DSH_HOME/profiles/web/package.json"
          if [ ! -f "$PROFILE" ]; then
            echo "::error::dsh plugin add did not scaffold the web profile at $PROFILE"
            find "$DSH_HOME" -maxdepth 3
            exit 1
          fi
          # Register the bundle row (the documented install step 2), keeping
          # whatever rows the scaffold already wrote.
          node -e '
            const fs = require("node:fs")
            const path = process.env.DSH_HOME + "/profiles/web/package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.dsh ??= {}
            pkg.dsh.profile ??= {}
            pkg.dsh.profile.bundles ??= ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]
            for (const row of ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-llm-newapi"]) {
              if (!pkg.dsh.profile.bundles.includes(row)) pkg.dsh.profile.bundles.push(row)
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
            console.log("bundles:", pkg.dsh.profile.bundles.join(", "))
          '
      - name: dsh web boots and serves the plugin
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          LOG="$RUNNER_TEMP/dsh-web.log"
          dsh web > "$LOG" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          code=""
          for _ in $(seq 1 120); do
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "::error::dsh web exited during startup"
              cat "$LOG"
              exit 1
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::dsh web did not become ready on :3080"
            cat "$LOG"
            exit 1
          fi
          echo "web ready on :3080"
          # The plugin's browser half is served for the module loader.
          client="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080/plugins/dsh-llm-newapi/client.js")"
          if [ "$client" != "200" ]; then
            echo "::error::client bundle not served (HTTP $client)"
            cat "$LOG"
            exit 1
          fi
          # The plugin's RPC channel exists: any answer but 405 proves the
          # route registered (405 is the SPA fallback rejecting a POST).
          rpc="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3080/llm-newapi/models-dev-params \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"ci-boot","method":"models-dev-params","payload":{"modelIds":[]}}')"
          if [ "$rpc" = "405" ]; then
            echo "::error::RPC channel /llm-newapi missing (405) — the channel did not register"
            cat "$LOG"
            exit 1
          fi
          echo "boot gate passed: web ready, client bundle HTTP $client, RPC channel HTTP $rpc"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create GitHub Release with the built tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-llm-newapi-*.tgz
          generate_release_notes: true
      - name: Publish to npm (optional, only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm publish
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-llm-newapi-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
