name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (host + client)
        run: npm run typecheck
      - name: Build (lib/index.js + lib/client.js)
        run: npm run build
      - name: Committed artifacts are current
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the rebuilt artifacts (github: installs build from the committed lib/)"
            exit 1
          }
      - name: Tests (client component suite + cordis composition smoke)
        run: npm test
      - name: Pack distribution tarball
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dsh-llm-newapi-*.tgz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create GitHub Release with the built tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-llm-newapi-*.tgz
          generate_release_notes: true
      - name: Publish to npm (optional, only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm publish
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-llm-newapi-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
